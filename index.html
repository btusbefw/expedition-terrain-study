<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expedition Terrain Study — CDRXRX</title><style>*{box-sizing:border-box}body{margin:0;background:#17191b;color:#e6edf2;font:15px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:32px auto;padding:0 24px}h1{font-size:22px;font-weight:500;margin:0 0 20px}video{display:block;width:100%;background:#17191b}p{color:#aeb7bf;margin:18px 0 12px}nav{display:flex;gap:24px}.versions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{font:inherit;font-size:13px;color:#aeb7bf;background:none;border:1px solid #444a50;border-radius:4px;padding:5px 12px;cursor:pointer}button[aria-pressed="true"]{color:#f3f5f7;border-color:#b5bec6}button:focus-visible{outline:2px solid #e4a15b;outline-offset:3px}a{color:#d6dde3;text-underline-offset:4px}</style><main><h1>Expedition terrain study</h1><video controls playsinline preload="metadata" poster="terrain-poster.png?v=3"><source src="terrain-study.mp4?v=3" type="video/mp4"></video><div class="versions" role="group" aria-label="Video version"><button type="button" data-video="terrain-study.mp4?v=3" data-poster="terrain-poster.png?v=3" aria-pressed="true">3D terrain</button><button type="button" data-video="variants/minimal.mp4" data-poster="variants/minimal.png" aria-pressed="false">Minimal trace</button><button type="button" data-video="variants/annotated.mp4" data-poster="variants/annotated.png" aria-pressed="false">Annotated trace</button></div><p>Independent study · synthetic terrain and figures — not client work or a real expedition.</p><nav><a id="download" href="terrain-study.mp4?v=3">Video</a><a href="https://github.com/btusbefw/expedition-terrain-study">Sources</a><a href="mailto:dev@dbrx.fr">Contact</a></nav></main><script>const video=document.querySelector("video");document.querySelectorAll(".versions button").forEach(button=>button.addEventListener("click",()=>{if(button.getAttribute("aria-pressed")==="true")return;video.pause();video.poster=button.dataset.poster;video.querySelector("source").src=button.dataset.video;video.load();document.querySelector("#download").href=button.dataset.video;document.querySelectorAll(".versions button").forEach(other=>other.setAttribute("aria-pressed",String(other===button)));}));</script></html>
