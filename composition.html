<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>*{box-sizing:border-box;margin:0}html,body,#root{width:1920px;height:1080px;overflow:hidden;background:#0A0B0D;color:#E6EDF2;font-family:sans-serif}.clip{position:absolute;inset:0}svg{position:absolute;inset:0;width:1920px;height:1080px}</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30"><div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
<svg viewBox="0 0 1920 1080" aria-label="Sculptural synthetic terrain, route transforming into an altitude profile"><ellipse id="shadow" cx="960" cy="735" rx="570" ry="140" fill="#050607"/><g id="mountain"></g><g id="chart" fill="none" stroke="#42484f" stroke-width="1"><path d="M290 425V830H1650"/><g fill="#aeb7bf" stroke="none" font-family="monospace" font-size="23"><text x="300" y="880">2,140 m</text><text x="1650" y="880" text-anchor="end">8.4 km</text></g></g><path id="routeGhost" fill="none" stroke="#819098" stroke-width="2"/><path id="route" fill="none" stroke="#FF5A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle id="halo" r="15" fill="none" stroke="#FF5A1F" stroke-width="1.5"/><circle id="head" r="5" fill="#FF5A1F"/><g id="summit"><path id="summitStem" fill="none" stroke="#aeb7bf"/><text id="summitLabel" fill="#E6EDF2" font-family="monospace" font-size="23" text-anchor="end">5,870 m</text></g></svg>
</div></div><script>
const ns='http://www.w3.org/2000/svg',mount=document.querySelector('#mountain');const defs=document.createElementNS(ns,'defs');mount.appendChild(defs);const rings=[];for(let j=0;j<34;j++){let p=document.createElementNS(ns,'path');p.setAttribute('stroke-width','1.6');let grad=document.createElementNS(ns,'linearGradient');grad.id='stone'+j;grad.setAttribute('x1','0%');grad.setAttribute('y1','10%');grad.setAttribute('x2','100%');grad.setAttribute('y2','85%');let g=31+j/34*30;for(let [o,v] of [[0,g+48],[.4,g+18],[1,g-5]]){let stop=document.createElementNS(ns,'stop');stop.setAttribute('offset',o*100+'%');stop.setAttribute('stop-color',`rgb(${Math.round(v)},${Math.round(v+3)},${Math.round(v+6)})`);grad.appendChild(stop)}defs.appendChild(grad);mount.appendChild(p);rings.push(p)}
const state={build:0,reveal:0,angle:-.24,morph:0};const mix=(a,b,t)=>a+(b-a)*t;const path=pts=>'M'+pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join('L');
function project(x,y,z){const c=Math.cos(state.angle),s=Math.sin(state.angle);return[960+(x*c-y*s)*.9,670+(x*s+y*c)*.522-z*.99]}
function draw(){rings.forEach((p,j)=>{const l=j/34,r=640*Math.pow(1-l,.72)+9,progress=Math.max(0,Math.min(1,(state.build-l*.24)/.76)),pts=[];for(let k=0;k<=180;k++){let a=k/180*Math.PI*2,v=1+.12*Math.sin(a*3)+.07*Math.cos(a*5+l*2)+.035*Math.sin(a*9-1);pts.push(project(Math.cos(a)*r*v,Math.sin(a)*r*v*.67,l*390*progress))}let g=Math.round(31+l*30);p.setAttribute('d',path(pts)+'Z');p.setAttribute('fill','url(#stone'+j+')');p.setAttribute('stroke',`rgb(${g+30},${g+33},${g+36})`)});let pts=[];for(let k=0;k<=160;k++){let t=k/160,a=2.18+.25*Math.sin(t*Math.PI*4),r=620*Math.pow(1-t,.72)+10,q=project(Math.cos(a)*r+Math.sin(t*27)*15*(1-t),Math.sin(a)*r*.67,t*390+6),f=[310+1320*t,815.461538-387.346154*t+8*Math.sin(t*14)*Math.sin(t*Math.PI)];pts.push([mix(q[0],f[0],state.morph),mix(q[1],f[1],state.morph)])}document.querySelector('#routeGhost').setAttribute('d',path(pts));let n=Math.max(1,Math.ceil(state.reveal*160)),part=pts.slice(0,n+1),tip=part.at(-1),end=pts.at(-1);document.querySelector('#route').setAttribute('d',path(part));for(let id of ['head','halo']){document.getElementById(id).setAttribute('cx',tip[0]);document.getElementById(id).setAttribute('cy',tip[1])}document.getElementById('summitStem').setAttribute('d',`M${end[0]} ${end[1]-12}v-40h-35`);let lab=document.getElementById('summitLabel');lab.setAttribute('x',end[0]-45);lab.setAttribute('y',end[1]-65)}draw();
const tl=gsap.timeline({paused:true});tl.fromTo('#mountain',{opacity:0},{opacity:1,duration:1.15},0).to(state,{build:1.2,duration:1.3,ease:'power2.out',onUpdate:draw},0).fromTo('#routeGhost',{opacity:0},{opacity:.45,duration:1},.8).fromTo('#route,#head,#halo',{opacity:0},{opacity:1,duration:.35},1.2).to(state,{reveal:1,duration:3.6,ease:'power1.inOut',onUpdate:draw},1.25).to(state,{angle:.02,duration:5.2,ease:'sine.inOut',onUpdate:draw},0).to(state,{morph:1,duration:1.05,ease:'power3.inOut',onUpdate:draw},5.2).to('#mountain,#shadow',{opacity:0,duration:.75},5.2).fromTo('#chart,#summit',{opacity:0},{opacity:1,duration:.5},5.95).to('#routeGhost',{opacity:.1,duration:.5},5.8).to({hold:0},{hold:1,duration:1.55},6.45);window.__timelines=window.__timelines||{};window.__timelines.main=tl;tl.seek(0);
</script></body></html>
