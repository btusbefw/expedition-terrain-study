const scene=new THREE.Scene();scene.background=new THREE.Color('#17191b');scene.fog=new THREE.Fog('#17191b',15,32);const camera=new THREE.OrthographicCamera(-4.65,4.65,2.615625,-2.615625,.1,50);

mountain.updateMatrixWorld(true);const ray=new THREE.Raycaster(),down=new THREE.Vector3(0,-1,0),surface=[];for(let i=0;i<=400;i++){let l=(N-1)/N*i/400,a=1.44+.30*Math.sin(l*Math.PI*3.6),q=levelShape(l,a);let center=new THREE.Vector3(-.48*l+.18*Math.sin(l*Math.PI),0,.16*Math.sin(l*Math.PI*1.3));q.x=lerp(center.x,q.x,.976);q.z=lerp(center.z,q.z,.976);ray.set(new THREE.Vector3(q.x,6,q.z),down);let hit=ray.intersectObjects(layers,false)[0];if(!hit)continue;let next=hit.point.clone();next.y+=.034;let prev=surface.at(-1);if(prev&&next.y-prev.y>.045)surface.push(new THREE.Vector3(prev.x,next.y,prev.z));surface.push(next);}ray.set(new THREE.Vector3(peak.x,6,peak.z),down);let phit=ray.intersectObjects(layers,false)[0];if(phit){let q=phit.point.clone();q.y+=.034;surface.push(q)}
